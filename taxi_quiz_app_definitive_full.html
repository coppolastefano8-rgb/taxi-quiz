<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taxi Quiz Trainer</title>
<style>
:root {
  --bg:#f6f7fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280; --primary:#2563eb;
  --ok:#16a34a; --bad:#dc2626; --border:#e5e7eb;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.container{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.04)}
h1,h2,h3,p{margin:0 0 12px}
.grid{display:grid;gap:12px}
.btn{width:100%;padding:14px 16px;border:none;border-radius:12px;background:var(--primary);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.btn.secondary{background:#e5e7eb;color:#111827}
.btn.ghost{background:#fff;color:#111827;border:1px solid var(--border)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 0}
.stat{font-size:14px;color:var(--muted)}
.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700}
.progress-wrap{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);width:0%}
.qtext{font-size:20px;line-height:1.35;margin-bottom:16px}
.option{display:block;width:100%;text-align:left;padding:14px 14px;border-radius:12px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:16px;margin-bottom:10px}
.option:hover{border-color:#93c5fd}
.option.correct{border-color:#86efac;background:#f0fdf4}
.option.wrong{border-color:#fca5a5;background:#fef2f2}
.option.disabled{pointer-events:none;opacity:.95}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.timer{font-weight:800;color:#b91c1c}
.hidden{display:none !important}
.small{font-size:13px;color:var(--muted)}
.center{text-align:center}
.footer{margin-top:14px}
</style>
</head>
<body>
<div class="container">
  <div id="home" class="card">
    <h1>Taxi Quiz Trainer</h1>
    <p class="small">Database: 516 domande — 273 conoscenze, 162 normative, 81 inglese.</p>
    <div class="grid" style="margin-top:14px">
      <button class="btn" id="startExamBtn">Simulazione esame</button>
      <div class="row">
        <button class="btn secondary" id="startWrongBtn">Allenamento errori</button>
        <button class="btn ghost" id="startNewBtn">Solo domande nuove</button>
      </div>
      <button class="btn ghost hidden" id="resumeBtn">Continua simulazione interrotta</button>
    </div>
    <div style="margin-top:18px">
      <div class="topbar">
        <span class="pill">Progressi</span>
        <span id="coverageText" class="stat"></span>
      </div>
      <div class="progress-wrap"><div id="coverageBar" class="progress-bar"></div></div>
      <div id="statsText" class="stat" style="margin-top:10px"></div>
    </div>
    <div class="footer row">
      <button class="btn ghost" id="exportBtn">Esporta progressi</button>
      <button class="btn ghost" id="importBtn">Importa progressi</button>
      <button class="btn secondary" id="resetBtn">Reset progressi</button>
    </div>
    <input type="file" id="importFile" class="hidden" accept="application/json">
  </div>

  <div id="quizView" class="card hidden">
    <div class="topbar">
      <div>
        <div id="qCounter" class="pill"></div>
        <div id="sectionBadge" class="small" style="margin-top:8px"></div>
      </div>
      <div class="timer" id="timer">30:00</div>
    </div>
    <div class="progress-wrap"><div id="examBar" class="progress-bar"></div></div>
    <div id="qText" class="qtext" style="margin-top:14px"></div>
    <div id="options"></div>
    <div id="feedback" class="small" style="min-height:22px;margin-top:6px"></div>
    <div class="footer row">
      <button class="btn secondary" id="nextBtn" disabled>Prossima</button>
      <button class="btn ghost" id="abortBtn">Torna alla home</button>
    </div>
  </div>

  <div id="resultView" class="card hidden">
    <h2>Risultato finale</h2>
    <p id="resultScore" class="qtext"></p>
    <p id="resultBreakdown" class="stat"></p>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="againBtn">Nuova simulazione</button>
      <button class="btn ghost" id="homeBtn">Home</button>
    </div>
  </div>
</div>

ti di autovetture, motocarrozzette, veicoli a trazione animale, natanti", "C": "conducenti di taxi e di noleggio con conducente", "correct": "B"}, {"id": "N27", "section": "normative", "num": 27, "q": "L'accertamento dell'iscrizione al ruolo provinciale dei conducenti al fine del rilascio delle licenze e delle \nautorizzazioni per l'esercizio dei servizi pubblici non di linea, spetta, ai sensi della legge 20/95:", "A": "alla Regione", "B": "alla Provincia", "C": "al Comune", "correct": "C"}, {"id": "N28", "section": "normative", "num": 28, "q": "Il possesso del CAP è requisito indispensabile ai sensi della legge 20/95 per l'iscrizione:", "A": "al Ruolo Provinciale dei conducenti", "B": "al Ruolo Provinciale dei conducenti, sezione natanti", "C": "all'apposita lista comunale conducenti di autovetture", "correct": "A"}, {"id": "N29", "section": "normative", "num": 29, "q": "Nelle zone ad intensa conurbazione individuate ai sensi della legge 20/95 i veicoli adibiti al servizio taxi hanno \ndiritto di:", "A": "effettuare il servizio nelle apposite aree di sosta", "B": "effettuare il servizio anche al di fuori del proprio turno di lavoro", "C": "requisire la licenza della Regione senza concorso pubblico", "correct": "A"}, {"id": "N30", "section": "normative", "num": 30, "q": "Sono requisiti indispensabili per l'iscrizione al ruolo, ai sensi della legge 20/95:", "A": "l'assolvimento dell'obbligo scolastico ed il possesso del CAP o della patente nautica", "B": "l'assolvimento dell'obbligo scolastico ed il possesso di idonea licenza rilasciata dalla Regione Lombardia", "C": "il possesso della patente D e del CAP", "correct": "A"}, {"id": "N31", "section": "normative", "num": 31, "q": "Il ruolo dei conducenti di veicoli o natanti adibiti ai servizi pubblici non di linea è istituito ai sensi della legge \n20/95, presso:", "A": "la Provincia", "B": "il Comune", "C": "le Camere di Commercio, Industria, Artigianato ed Agricoltura", "correct": "C"}, {"id": "N32", "section": "normative", "num": 32, "q": "Per prestare l'attività di conducente di veicoli adibiti ai servizi pubblici non di linea è indispensabile \nl'iscrizione al ruolo:", "A": "sempre", "B": "solo in mancanza del CAP", "C": "solo se non si è dipendenti", "correct": "A"}, {"id": "N33", "section": "normative", "num": 33, "q": "La Commissione Regionale per la formazione e conservazione del ruolo dei conducenti, di cui all'art. 12 della \nlegge 20/95, dura in carica:", "A": "due anni", "B": "cinque anni", "C": "quattro anni", "correct": "C"}, {"id": "N34", "section": "normative", "num": 34, "q": "La ricevuta comprovante l'importo della corsa, relativamente al servizio taxi, ai sensi della legge 20/95 va \nrilasciata all'utente:", "A": "obbligatoriamente", "B": "a richiesta", "C": "obbligatoriamente, solo in caso di importo superiore a 25 euro", "correct": "B"}, {"id": "N35", "section": "normative", "num": 35, "q": "Il servizio taxi può essere esercitato con natanti:", "A": "sì", "B": "no", "C": "solo nel caso in cui il natante sia già in possesso di autorizzazione per il servizio di noleggio con conducente", "correct": "A"}, {"id": "N36", "section": "normative", "num": 36, "q": "Di quanti articoli è composta la legge 21/92:", "A": "27", "B": "7", "C": "15", "correct": "C"}, {"id": "N37", "section": "normative", "num": 37, "q": "Per quanto non previsto e disciplinato dalla legge 20/95 si fa riferimento:", "A": "alla legge 15/01/92 n. 21", "B": "ai singoli regolamenti comunali taxi e noleggio", "C": "alle consuetudini", "correct": "A"}, {"id": "N38", "section": "normative", "num": 38, "q": "Gli autoservizi pubblici non di linea sono quelli che:", "A": "provvedono al solo trasporto individuale di persone", "B": "provvedono al solo trasporto collettivo di persone con relativo bagaglio", "C": "provvedono al trasporto individuale e collettivo di persone", "correct": "C"}, {"id": "N39", "section": "normative", "num": 39, "q": "Quale funzione svolgono gli autoservizi pubblici non di linea riffe per il servizio taxi:", "A": "la Giunta Regionale", "B": "la Provincia", "C": "il Comune", "correct": "C"}, {"id": "N62", "section": "normative", "num": 62, "q": "Chi fa il regolamento comunale:", "A": "il Comune", "B": "la Provincia", "C": "la Regione", "correct": "A"}, {"id": "N63", "section": "normative", "num": 63, "q": "Quanto segna il tassametro all'inizio della corsa:", "A": "euro 3,87", "B": "euro 5,16", "C": "euro 3,90", "correct": "C"}, {"id": "N64", "section": "normative", "num": 64, "q": "Chi mette i sigilli al tassametro:", "A": "la Regione", "B": "la Prefettura", "C": "il Comune d'appartenenza", "correct": "C"}, {"id": "N65", "section": "normative", "num": 65, "q": "Cosa s'intende per uso collettivo del taxi:", "A": "servizio rivolto al nucleo familiare", "B": "servizio con partenza medesima e con destinazione sulla medesima direttrice", "C": "servizio accordato con libera contrattazione", "correct": "B"}, {"id": "N66", "section": "normative", "num": 66, "q": "Secondo l'art. 6 della disciplina aeroportuale nel sistema aeroportuale dove sostano i soggetti legittimati al \nservizio N.C.C.:", "A": "sul luogo pubblico", "B": "in autorimessa distante minimo 1 km dall'aerostazione", "C": "in apposite aree aeroportuali individuate come rimesse", "correct": "C"}, {"id": "N67", "section": "normative", "num": 67, "q": "Quando un titolare può trasferire la licenza:", "A": "quando ha compiuto 60 anni", "B": "quando ha compiuto 65 anni", "C": "quando ha compiuto 60 anni ed ha maturato 35 anni di attività", "correct": "A"}, {"id": "N68", "section": "normative", "num": 68, "q": "I comuni che non fanno parte del bacino di utenza aeroportuale potranno essere integrati e quindi avere \ndiritto di sosta e carico dagli aeroporti:", "A": "solo dopo un referendum", "B": "solo se le autopubbliche hanno installato il radiotaxi satellitare", "C": "solo dopo un anno dalla data d'entrata in vigore della disciplina per il servizio taxi nel sistema aeroportuale", "correct": const STORAGE_KEY = "taxiQuizTrainerV5";

let state = loadState();

function defaultState(){
  return {
    seen: {},
    wrong: {},
    correct: {},
    simulations: 0,
    totalAnswered: 0,
    totalCorrect: 0,
    currentSession: null
  };
}

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? Object.assign(defaultState(), JSON.parse(raw)) : defaultState();
  } catch(e) {
    return defaultState();
  }
}

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

window.addEventListener("beforeunload", saveState);
document.addEventListener("visibilitychange", () => { if(document.hidden) saveState(); });

const byId = id => document.getElementById(id);
const home = byId("home"), quizView = byId("quizView"), resultView = byId("resultView");
const coverageText = byId("coverageText"), coverageBar = byId("coverageBar"), statsText = byId("statsText");
const resumeBtn = byId("resumeBtn");

function questionMap() {
  const m = new Map();
  QUESTIONS.forEach(q => m.set(q.id, q));
  return m;
}
const QMAP = questionMap();

function updateHome(){
  const seenCount = Object.keys(state.seen).length;
  const wrongCount = Object.keys(state.wrong).length;
  const coverage = Math.round((seenCount / QUESTIONS.length) * 100);
  coverageText.textContent = `${seenCount} / ${QUESTIONS.length} viste (${coverage}%)`;
  coverageBar.style.width = `${coverage}%`;
  const avg = state.totalAnswered ? (state.totalCorrect / state.totalAnswered * 100).toFixed(1) : "0.0";
  statsText.innerHTML = `Errori memorizzati: ${wrongCount}<br>Simulazioni fatte: ${state.simulations}<br>Accuratezza totale: ${avg}%`;
  resumeBtn.classList.toggle("hidden", !state.currentSession);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function pickWeighted(section, count, mode="exam"){
  const pool = QUESTIONS.filter(q => q.section===section);
  const unseen = pool.filter(q => !state.seen[q.id]);
  const wrong = pool.filter(q => state.wrong[q.id]);
  let selected = [];

  if(mode === "wrong") {
    const src = wrong.length ? shuffle(wrong) : shuffle(pool);
    return src.slice(0, Math.min(count, src.length));
  }

  if(mode === "new") {
    const src = unseen.length ? shuffle(unseen) : shuffle(pool);
    return src.slice(0, Math.min(count, src.length));
  }

  // exam mode: 40% unseen, 40% wrong, 20% random
  const unseenTarget = Math.round(count*0.4);
  const wrongTarget = Math.round(count*0.4);
  const randomTarget = count - unseenTarget - wrongTarget;

  selected.push(...shuffle(unseen).slice(0, unseenTarget));
  const selectedIds = new Set(selected.map(q=>q.id));
  selected.push(...shuffle(wrong.filter(q=>!selectedIds.has(q.id))).slice(0, wrongTarget));
  const selectedIds2 = new Set(selected.map(q=>q.id));
  selected.push(...shuffle(pool.filter(q=>!selectedIds2.has(q.id))).slice(0, randomTarget));

  // fill if not enough
  if(selected.length < count){
    const ids = new Set(selected.map(q=>q.id));
    selected.push(...shuffle(pool.filter(q=>!ids.has(q.id))).slice(0, count-selected.length));
  }
  return shuffle(selected).slice(0, count);
}

function makeSession(mode="exam"){
  let picks = [];
  if(mode==="exam"){
    picks = [
      ...pickWeighted("conoscenze", 6, "exam"),
      ...pickWeighted("normative", 6, "exam"),
      ...pickWeighted("inglese", 4, "exam")
    ];
  } else if(mode==="wrong"){
    picks = [
      ...pickWeighted("conoscenze", 6, "wrong"),
      ...pickWeighted("normative", 6, "wrong"),
      ...pickWeighted("inglese", 4, "wrong")
    ];
  } else {
    picks = [
      ...pickWeighted("conoscenze", 6, "new"),
      ...pickWeighted("normative", 6, "new"),
      ...pickWeighted("inglese", 4, "new")
    ];
  }
  picks = shuffle(picks);
  return {
    mode,
    queue: picks.map(q=>q.id),
    index: 0,
    score: 0,
    answered: [],
    startTime: Date.now(),
    remainingSec: 30*60,
    finished: false,
    perSection: {conoscenze:0,normative:0,inglese:0},
    lastTick: Date.now()
  };
}

let timerHandle = null;

function startSession(mode){
  state.currentSession = makeSession(mode);
  saveState();
  openSession();
}

function openSession(){
  if(!state.currentSession) return;
  home.classList.add("hidden");
  resultView.classList.add("hidden");
  quizView.classList.remove("hidden");
  renderQuestion();
  startTimer();
}

function startTimer(){
  clearInterval(timerHandle);
  timerHandle = setInterval(() => {
    if(!state.currentSession) return;
    const now = Date.now();
    const elapsed = Math.floor((now - state.currentSession.lastTick)/1000);
    if(elapsed>0){
      state.currentSession.remainingSec = Math.max(0, state.currentSession.remainingSec - elapsed);
      state.currentSession.lastTick = now;
      saveState();
      renderTimer();
      if(state.currentSession.remainingSec <= 0){
        finishSession();
      }
    }
  }, 500);
}

function renderTimer(){
  const sec = state.currentSession?.remainingSec ?? 0;
  const m = String(Math.floor(sec/60)).padStart(2,'0');
  const s = String(sec%60).padStart(2,'0');
  byId("timer").textContent = `${m}:${s}`;
}

function renderQuestion(){
  const sess = state.currentSession;
  if(!sess) return;
  const q = QMAP.get(sess.queue[sess.index]);
  if(!q) return;
  byId("qCounter").textContent = `Domanda ${sess.index+1} / ${sess.queue.length}`;
  byId("sectionBadge").textContent = q.section.charAt(0).toUpperCase() + q.section.slice(1);
  byId("qText").textContent = q.q;
  byId("examBar").style.width = `${(sess.index/sess.queue.length)*100}%`;
  renderTimer();
  const options = byId("options");
  options.innerHTML = "";
  ["A","B","C"].forEach(letter => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.innerHTML = `<strong>${letter})</strong> ${q[letter]}`;
    btn.onclick = () => answer(letter);
    options.appendChild(btn);
  });
  byId("feedback").textContent = "";
  byId("nextBtn").disabled = true;
}

function answer(letter){
  const sess = state.currentSession;
  if(!sess) return;
  const q = QMAP.get(sess.queue[sess.index]);
  if(!q) return;
  const options = Array.from(document.querySelectorAll(".option"));
  options.forEach(btn => btn.classList.add("disabled"));
  const idx = {A:0,B:1,C:2}[letter];
  const correctIdx = {A:0,B:1,C:2}[q.correct];
  options[correctIdx].classList.add("correct");
  let ok = letter === q.correct;
  if(!ok) options[idx].classList.add("wrong");
  byId("feedback").innerHTML = ok
    ? `<span style="color:var(--ok);font-weight:700">✓ Corretta</span>`
    : `<span style="color:var(--bad);font-weight:700">✗ Errata</span> — corretta: <strong>${q.correct}</strong>`;
  if(ok) {
    sess.score++;
    sess.perSection[q.section]++;
    state.correct[q.id] = (state.correct[q.id]||0)+1;
    delete state.wrong[q.id];
    state.totalCorrect++;
  } else {
    state.wrong[q.id] = (state.wrong[q.id]||0)+1;
  }
  state.seen[q.id] = (state.seen[q.id]||0)+1;
  state.totalAnswered++;
  sess.answered.push({id:q.id, chosen:letter, correct:q.correct, ok});
  saveState();
  byId("nextBtn").disabled = false;
}

function nextQuestion(){
  const sess = state.currentSession;
  if(!sess) return;
  sess.index++;
  saveState();
  if(sess.index >= sess.queue.length) {
    finishSession();
  } else {
    renderQuestion();
  }
}

function finishSession(){
  const sess = state.currentSession;
  if(!sess) return;
  clearInterval(timerHandle);
  state.simulations++;
  const total = sess.queue.length;
  byId("resultScore").textContent = `${sess.score} / ${total}`;
  byId("resultBreakdown").innerHTML = `Conoscenze: ${sess.perSection.conoscenze} / 6<br>Normative: ${sess.perSection.normative} / 6<br>Inglese: ${sess.perSection.inglese} / 4`;
  state.currentSession = null;
  saveState();
  quizView.classList.add("hidden");
  resultView.classList.remove("hidden");
  updateHome();
}

function backHome(){
  clearInterval(timerHandle);
  quizView.classList.add("hidden");
  resultView.classList.add("hidden");
  home.classList.remove("hidden");
  updateHome();
}

byId("startExamBtn").onclick = () => startSession("exam");
byId("startWrongBtn").onclick = () => startSession("wrong");
byId("startNewBtn").onclick = () => startSession("new");
byId("resumeBtn").onclick = () => openSession();
byId("nextBtn").onclick = nextQuestion;
byId("abortBtn").onclick = () => backHome();
byId("againBtn").onclick = () => startSession("exam");
byId("homeBtn").onclick = () => backHome();

byId("resetBtn").onclick = () => {
  if(confirm("Vuoi cancellare tutti i progressi?")) {
    state = defaultState();
    saveState();
    clearInterval(timerHandle);
    backHome();
  }
};

byId("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "taxi-quiz-progressi.json";
  a.click();
  URL.revokeObjectURL(a.href);
};

byId("importBtn").onclick = () => byId("importFile").click();
byId("importFile").onchange = (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const imported = JSON.parse(r.result);
      state = Object.assign(defaultState(), imported);
      saveState();
      updateHome();
      alert("Progressi importati.");
    } catch(err) {
      alert("File non valido.");
    }
  };
  r.readAsText(file);
};

updateHome();
</script>
