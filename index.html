<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Taxi Quiz Trainer</title>

<style>
body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
padding:20px;
}

button{
padding:12px 20px;
margin:10px;
font-size:16px;
cursor:pointer;
}

.quiz{
background:white;
padding:20px;
border-radius:8px;
max-width:600px;
margin:auto;
}

.option{
display:block;
margin:10px;
padding:10px;
background:#e6e6e6;
border-radius:6px;
cursor:pointer;
}

.correct{background:#9be79b;}
.wrong{background:#ff9b9b;}
</style>
</head>

<body>

<h2>Taxi Quiz Trainer</h2>

<div id="home">
<button onclick="startExam()">Simulazione Esame</button>
<button onclick="resetProgress()">Reset progressi</button>

<p id="stats"></p>
</div>

<div id="quiz" class="quiz" style="display:none">

<h3 id="question"></h3>

<div id="options"></div>

<p id="result"></p>

<button onclick="nextQuestion()">Prossima</button>

</div>

<script>

let progress = JSON.parse(localStorage.getItem("taxiQuizProgress")) || {
seen:[],
wrong:[],
score:0
}

let questions=[
{q:"Il Lago Benaco è:",a:["Garda","Maggiore","Iseo"],c:0},
{q:"Campione si trova in provincia di:",a:["Milano","Como","Svizzera"],c:1},
{q:"Il servizio taxi si rivolge ad una utenza:",a:["indifferenziata","privata","turistica"],c:0},
{q:"Costituiscono autoservizi pubblici non di linea:",a:["Taxi","Treni","Bus"],c:0},
{q:"Translate: Airport",a:["Aeroporto","Porto","Stazione"],c:0},
{q:"Translate: Driver",a:["Autista","Passeggero","Controllore"],c:0}
]

let exam=[]
let index=0

function saveProgress(){
localStorage.setItem("taxiQuizProgress", JSON.stringify(progress));
}

window.addEventListener("beforeunload", function(){
saveProgress();
});

function updateStats(){
document.getElementById("stats").innerHTML=
"Domande viste: "+progress.seen.length+
"<br>Errori: "+progress.wrong.length
}

function startExam(){

exam=[]

for(let i=0;i<16;i++){
let q=questions[Math.floor(Math.random()*questions.length)]
exam.push(q)
}

index=0

document.getElementById("home").style.display="none"
document.getElementById("quiz").style.display="block"

showQuestion()

}

function showQuestion(){

let q=exam[index]

document.getElementById("question").innerHTML=(index+1)+"/16 - "+q.q

let html=""

q.a.forEach((opt,i)=>{
html+="<div class='option' onclick='answer("+i+")'>"+opt+"</div>"
})

document.getElementById("options").innerHTML=html

}

function answer(i){

let q=exam[index]

let options=document.querySelectorAll(".option")

options.forEach(o=>o.style.pointerEvents="none")

if(i===q.c){

options[i].classList.add("correct")
progress.score++

}else{

options[i].classList.add("wrong")
options[q.c].classList.add("correct")

progress.wrong.push(q.q)

}

progress.seen.push(q.q)

saveProgress()

}

function nextQuestion(){

index++

if(index>=exam.length){

alert("Punteggio: "+progress.score+"/16")

progress.score=0

document.getElementById("quiz").style.display="none"
document.getElementById("home").style.display="block"

updateStats()

return

}

showQuestion()

}

function resetProgress(){

localStorage.removeItem("taxiQuizProgress")
location.reload()

}

updateStats()

</script>

</body>
</html>
